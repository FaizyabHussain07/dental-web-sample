<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Brightside Dental to book your next appointment.">
    <title>Contact | Brightside Dental</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="appointment-section contact-page">
        <div class="container appointment-layout">
            <section class="appointment-copy" aria-labelledby="contact-title">
                <p class="eyebrow"><span class="eyebrow-dot"></span> Get in touch</p>
                <h1 id="contact-title">Let’s make your smile <em>brighter.</em></h1>
                <p>
                    Have a question or ready to book a visit? Send us a message and
                    our friendly team will get back to you shortly.
                </p>

                <div class="contact-detail">
                    <span aria-hidden="true">✦</span>
                    <div>
                        <small>Call our team</small>
                        <strong>(555) 014-2024</strong>
                    </div>
                </div>
                <div class="contact-detail">
                    <span aria-hidden="true">✉</span>
                    <div>
                        <small>Email us</small>
                        <strong>hello@brightsidedental.com</strong>
                    </div>
                </div>
            </section>

            <form class="appointment-form" action="https://formivo.faizyab.me/api/f/9e31bfab-e881-47de-9425-eaf22849e133" method="POST">
                <div class="form-row">
                    <label>
                        Your name
                        <input type="text" name="name" placeholder="Jane Smith" autocomplete="name" required>
                    </label>
                    <label>
                        Email address
                        <input type="email" name="email" placeholder="jane@example.com" autocomplete="email" required>
                    </label>
                </div>
                <label>
                    Phone number
                    <input type="tel" name="phone" placeholder="(555) 014-2024" autocomplete="tel">
                </label>
                <label>
                    How can we help?
                    <textarea name="message" rows="5" placeholder="Tell us a little about your question or preferred appointment time." required></textarea>
                </label>
                <button class="button form-submit" type="submit">Send message <span aria-hidden="true">→</span></button>
                <small class="form-note">We’ll only use your details to respond to your message.</small>
            </form>
        </div>
    </main>
</body>
</html>
